name: Build QMK Firmware
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up QMK Environment
      run: |
        python3 -m pip install qmk
        qmk setup -y

    - name: Link Keyboard Folder
      run: |
        ln -s "$GITHUB_WORKSPACE/Firmware" keyboards/kyps75

    - name: Compile Firmware
      run: |
        qmk compile -kb kyps75 -km default

    - name: Upload Finished Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kyps75-firmware
        path: .build/*.uf2

