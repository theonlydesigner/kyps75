name: Build QMK Firmware
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up QMK Environment
      run: |
        python3 -m pip install qmk
        qmk setup -y

    - name: Install ARM GCC Toolchain Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi dos2unix

    - name: Link Keyboard Folder to QMK Tree
      run: |
        ln -s "$GITHUB_WORKSPACE/Firmware" /home/runner/qmk_firmware/keyboards/kyps75

    - name: Compile Firmware
      run: |
        cd /home/runner/qmk_firmware
        qmk compile -kb kyps75 -km default

    - name: Upload Finished Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kyps75-firmware
        path: /home/runner/qmk_firmware/.build/*.uf2
